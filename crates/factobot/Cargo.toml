[package]
name = "factobot"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Factorio benchmark harness for AI agents: daemon, `fac` CLI and game bridge"

[[bin]]
name = "fac"
path = "src/main.rs"

# The agent's `fac`: the playtest sandbox mounts it as `fac`. It has no code
# for `daemon`, `watch` or `dev` (decision 64).
[[bin]]
name = "fac-agent"
path = "src/bin/fac-agent.rs"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
libc = "0.2.191"
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util", "process", "signal", "time", "sync", "fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
