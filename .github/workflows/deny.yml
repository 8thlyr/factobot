name: Cargo deny

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # New RustSec advisories arrive without a lockfile change.
    - cron: "17 6 * * 1"

concurrency:
  group: deny-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cargo-deny:
    name: cargo deny check
    # GitHub-hosted. This job only reads the lockfile and must not move
    # to the self-hosted runner.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # v2.1.1 bundles cargo-deny 0.20.2.
      # https://github.com/EmbarkStudios/cargo-deny-action/releases/tag/v2.1.1
      - uses: EmbarkStudios/cargo-deny-action@v2.1.1
        with:
          # The action image ships Rust 1.85.0. The workspace rust-version
          # is 1.99, so install the toolchain mise pins.
          rust-version: "1.99.1"
          arguments: "--locked --all-features"
