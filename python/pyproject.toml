[project]
name = "factobot"
version = "0.1.0"
description = "Python client and Inspect AI tasks for the factobot Factorio agent benchmark"
readme = "README.md"
license = "MIT OR Apache-2.0"
requires-python = ">=3.12"
dependencies = ["inspect-ai>=0.3.287"]

[project.entry-points.inspect_ai]
factobot = "factobot._registry"

[project.urls]
Repository = "https://github.com/8thlyr/factobot"

# Inspect calls each model provider through that provider's SDK.
[project.optional-dependencies]
anthropic = ["anthropic>=2.3.0"]
openai = ["openai>=3.42.1"]

[dependency-groups]
dev = ["pytest>=9", "ruff>=0.15", "basedpyright>=1.30"]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.basedpyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
include = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
